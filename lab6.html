    <body>
        
        <!-- jumbotron to replace the header text from previous lab -->
        <div class = "jumbotron jumbotron-fluid">
            <div class="container">
                <center>
                    <h1 class="display-4">Brandon Tang's Lab 6 Cat facts</h1>
                    <p class="lead"></p>
                </center>
            </div>
        </div>
        <!-- nav bar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>

        <!-- paragraph -->
        <div>
            <img id="catImage" src="league.png">
            <button id="APIFetch" onclick="fetchCatData()">Fetch cat facts!</button>
            <div id="catFacts"></div>
        </div>
         <script>
            function fetchCatData(){
                const url = "https://brianobruno.github.io/cats.json";
                fetch(url)
                .then(response => {
                    if(!response.ok){
                        throw new Error("Error: " + response.status);
                    } else {
                        return response.json();
                    }
                }).then(data => {
                    const rawCatFacts = data.facts;
                    const sortedCatFacts = rawCatFacts.sort((a, b) => a.factId - b.factId);
                    console.log(sortedCatFacts);
                    const image = document.getElementById("catImage");
                    image.src = data.catPhoto;
                    image.alt = "Image of a cat!";
                    document.getElementById("catFacts").innerHTML = "<h1>Cat facts!</h1><ul>";
                    sortedCatFacts.forEach(catFact => {
                        document.getElementById("catFacts").innerHTML += `<li>${catFact.factId}. ${catFact.text}</li>`;
                    });
                    document.getElementById("catFacts").innerHTML += "</ul>";
                })
            }
	    </script>
        <hr>
        <p>3/12 Author: Brandon Tang</p>
        <hr>
