<!DOCTYPE html>
<html>
    <link rel="stylesheet" href="charts.css"> <!-- separate css file for the charts page -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Weekly Top Artists | Brandon Tang's Final Project </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="charts.js"></script>
    </head>
    <body class="bg-light">
        <div class="container py-5">
            <h1 class="text-center mb-4">Weekly Top Artists</h1>
                <div class="row mb-4 justify-content-center">
                    <div class="col-md-4">
                        <label for="playcountFilter" class="form-label fw-bold text-secondary small">Filter by:</label> <!--filter -->
                            <select class="form-select shadow-sm" id="dropdown" onchange="dropdown()"> <!--dropdown menu -->
                                <option value="chart-number">Chart Number</option>
                                <option value="high-low">Playcount (High to Low)</option>
                                <option value="low-high">Playcount (Low to High)</option>
                                <option value="alphabetical">Alphabetical</option>
                            </select>
                    </div>
                </div>
            <div id="artists" class="row g-4"> <!--artist container, updated in the script -->
                <div class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div> 
        <hr>
        <p class="text-center text-muted">Last.fm Weekly Top Artists Tracker | Brandon Tang's Final Project</p>
    </body>
</html>
